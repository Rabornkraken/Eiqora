[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eiqora"
version = "0.1.0"
description = "High-Performance Financial Analysis Pipeline"
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-openai",
    "pydantic",
    "pydantic-settings",
    "yfinance",
    "alpha-vantage",
    "tavily-python",
    "chromadb",
    "tiktoken",
    "python-dotenv",
    "rich",
    "ta",
    "requests",
    "boto3",
    "feedparser",
    "psycopg[binary]",
    "sqlalchemy",
    "alembic",
    "openpyxl",
    "sentence-transformers",
    "asyncpg",
    "openai",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "isort",
    "mypy"
]

[tool.setuptools.packages.find]
include = ["eiqora*", "eiqora_v2*"]
exclude = ["chroma_db*"]

